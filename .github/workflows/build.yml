name: Build Jetsam Changer (iOS 17.x - 18.x)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA & TIPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize Line Endings (CRLF -> LF)
        run: |
          find . -type f \( -name "*.h" -o -name "*.m" -o -name "*.c" -o -name "*.swift" -o -name "*.plist" -o -name "*.sh" -o -name "Makefile" \) -exec sed -i '' 's/\r$//' {} + 2>/dev/null || true

      - name: Select Xcode 15 / 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          for xcode_path in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$xcode_path/Contents/Developer" ]; then
              echo "Selecting $xcode_path/Contents/Developer"
              sudo xcode-select -s "$xcode_path/Contents/Developer"
              break
            elif [ -d "$xcode_path" ]; then
              echo "Selecting $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build Application
        run: |
          set -o pipefail
          chmod +x ./build_ci.sh
          ./build_ci.sh 2>&1 | tee build_debug.log || {
            echo "## ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build_debug.log

      - name: Verify Build Output & Populate Summary
        if: always()
        run: |
          echo "## 📋 Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build_debug.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## 📂 Files in build_output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la build_output 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push Build Debug Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug
          find . -maxdepth 3 -ls > file_tree.txt
          git add -f build_debug.log file_tree.txt build_output 2>/dev/null || true
          git commit -m "ci: debug log and artifacts" || true
          git push -f origin ci-debug || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaraToolbox-Release
          path: |
            build_output/*.ipa
            build_output/*.tipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Lara Toolbox v2.0 (Build ${{ github.run_number }})"
          fail_on_unmatched_files: false
          body: |
            ## 🚀 Lara Toolbox (iOS 16.0 – 18.4.1+)
            
            Bộ công cụ Exploit Toolbox toàn diện cho iOS 16.0 – 18.4.1+ tích hợp kiến trúc **DarkSword / kfd** (tối ưu đặc biệt cho chip A14 Bionic / arm64e).

            ### 📦 Tệp Cài Đặt:
            - **`LaraToolbox.tipa`**: Dành cho **TrollStore** (iOS 14.0 - 17.0).
            - **`LaraToolbox.ipa`**: Dành cho **SideStore / AltStore / Feather / Sideloadly** (iOS 16.0 - 18.4.1+).

            ### ✨ Các Chức Năng Nổi Bật:
            1. **💉 Tiêm Tweak Trực Tiếp (In-Place Dylib Injector)**:
               - Quét danh sách app đã cài đặt trên máy.
               - Chọn file `.dylib` từ ứng dụng Tệp và tiêm trực tiếp vào binary Mach-O (`LC_LOAD_DYLIB`).
               - **KHÔNG CẦN XOÁ HAY CÀI LẠI APP**, giữ nguyên 100% dữ liệu.
               - Hỗ trợ nút **Gỡ Tweak (Eject)** và **Khôi Phục Bản Gốc (.orig)**.
            2. **⚙️ Quản Lý Dịch Vụ Ngầm (LaunchDaemons Manager)**:
               - Nút **Tối Ưu 1-Chạm**: Đóng băng ReportCrash, Telemetry, OTA update, giải phóng ~400MB+ RAM và làm mát máy tức thì.
               - Bật/tắt từng LaunchDaemon tùy ý.
            3. **🛠️ Tiện Ích Exploit Chuyên Sâu**:
               - **Gaming Thermal Bypass**: Khóa 100% độ sáng màn hình, giữ max xung nhịp CPU/GPU khi chơi game nặng, chống drop FPS.
               - **JIT On-Device Enabler**: Kích hoạt JIT cho PojavLauncher (Minecraft), Dolphin, PPSSPP, UTM không cần PC/Wi-Fi.
               - **Fake GPS Tầng Kernel**: Hook locationd giả lập vị trí toàn hệ thống, chống phát hiện tuyệt đối.
               - **Chặn Cập Nhật iOS Vĩnh Viễn**: Đóng băng daemon softwareupdated.
               - **Bật Dynamic Island**: Cho các dòng máy A14 / iPhone 12.
               - **Bộ Điều Khiển Jetsam & RAM**: Chỉnh RAM lên đến 16 GB hoặc Không Giới Hạn (-1).
            4. **💻 Console & Kernel Status**:
               - Quản lý trạng thái DarkSword Kernel Exploit, PAC, SPTM, Root (`uid=0`), Unsandbox.
               - Terminal log theo thời gian thực.
          files: |
            build_output/LaraToolbox.ipa
            build_output/LaraToolbox.tipa
            build_output/JetsamChanger.ipa
            build_output/JetsamChanger.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
