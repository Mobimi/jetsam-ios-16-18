name: Build Jetsam Changer (iOS 17.x - 18.x)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA & TIPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize Line Endings (CRLF -> LF)
        run: |
          find . -type f \( -name "*.h" -o -name "*.m" -o -name "*.c" -o -name "*.swift" -o -name "*.plist" -o -name "*.sh" -o -name "Makefile" \) -exec sed -i '' 's/\r$//' {} + 2>/dev/null || true

      - name: Select Xcode 15 / 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          for xcode_path in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$xcode_path/Contents/Developer" ]; then
              echo "Selecting $xcode_path/Contents/Developer"
              sudo xcode-select -s "$xcode_path/Contents/Developer"
              break
            elif [ -d "$xcode_path" ]; then
              echo "Selecting $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build Application
        run: |
          chmod +x ./build_ci.sh
          ./build_ci.sh 2>&1 | tee build_debug.log || {
            echo "## ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build_debug.log

      - name: Verify Build Output & Populate Summary
        if: always()
        run: |
          echo "## 📋 Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build_debug.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## 📂 Files in build_output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la build_output 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push Build Debug Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug
          find . -maxdepth 3 -ls > file_tree.txt
          git add -f build_debug.log file_tree.txt build_output 2>/dev/null || true
          git commit -m "ci: debug log and artifacts" || true
          git push -f origin ci-debug || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JetsamChanger-Release
          path: |
            build_output/JetsamChanger.ipa
            build_output/JetsamChanger.tipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Jetsam Changer v1.0 (Build ${{ github.run_number }})"
          fail_on_unmatched_files: false
          body: |
            ## 🚀 Jetsam Changer (iOS 17.x – 18.x)
            
            Ứng dụng chỉnh bộ nhớ Jetsam & Priority cho iOS 17.0 - 18.x tích hợp **Automated Kernel Exploit** và **Dynamic Offset Calibration**.

            ### 📦 Tệp Cài Đặt:
            - **`JetsamChanger.tipa`**: Dành cho **TrollStore** (iOS 17.0).
            - **`JetsamChanger.ipa`**: Dành cho **SideStore / AltStore / Sideloadly** (iOS 17.1 – 18.x).

            ### ✨ Tính Năng:
            - Giao diện đơn giản chia thành 2 tab: **Danh Sách App** và **Cài Đặt & Console**.
            - Tìm kiếm app nhanh chóng qua tên app hoặc Bundle ID.
            - Điều chỉnh mức RAM Jetsam tùy ý từ 512 MB lên đến 16 GB hoặc chế độ **Không Giới Hạn (Unlimited ∞)**.
            - Hỗ trợ các preset cấu hình nhanh: Amethyst / Pojav (6GB), Giả lập Dolphin/UTM (4GB).
            - Bảng Console & Status kiểm tra chi tiết trạng thái Kernel Exploit và log lỗi.
          files: |
            build_output/JetsamChanger.ipa
            build_output/JetsamChanger.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
